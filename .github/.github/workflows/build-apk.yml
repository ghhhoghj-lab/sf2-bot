
name: Build SF2 Bot APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q ShadowFight2Bot_Android_Source_CloudBuild.zip -d /tmp/sf2
          cd /tmp/sf2/ShadowFight2Bot
          echo "PROJECT_DIR=/tmp/sf2/ShadowFight2Bot" >> $GITHUB_ENV

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/ShadowFight2Bot.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShadowFight2Bot-APK
          path: ShadowFight2Bot.apk
