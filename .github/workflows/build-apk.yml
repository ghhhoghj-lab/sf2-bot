name: Build SF2 Bot APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q ShadowFight2Bot_Android_Source_CloudBuild.zip -d /tmp/sf2
          echo "PROJECT_DIR=/tmp/sf2/ShadowFight2Bot" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Fix Java and Kotlin JVM targets
        run: |
          cat > "$RUNNER_TEMP/jvm17.init.gradle" <<'GRADLE'
          gradle.projectsEvaluated {
              gradle.rootProject.allprojects { project ->
                  project.tasks.withType(
                      org.gradle.api.tasks.compile.JavaCompile
                  ).configureEach {
                      sourceCompatibility = '17'
                      targetCompatibility = '17'
                  }

                  project.tasks.configureEach { task ->
                      if (task.class.name.contains('KotlinCompile')) {
                          task.kotlinOptions.jvmTarget = '17'
                      }
                  }
              }
          }
          GRADLE

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon \
            --init-script "$RUNNER_TEMP/jvm17.init.gradle" \
            assembleDebug

          test -f app/build/outputs/apk/debug/app-debug.apk

          cp app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/ShadowFight2Bot.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShadowFight2Bot-APK
          path: ShadowFight2Bot.apk
          if-no-files-found: error
