name: Build ShadowPilot AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android source
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$GITHUB_WORKSPACE/ShadowPilot_AI_Source.zip"
          if [ ! -f "$ARCHIVE" ]; then
            echo "::error::ShadowPilot_AI_Source.zip is missing from the repository root."
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi
          mkdir -p /tmp/shadowpilot
          unzip -q "$ARCHIVE" -d /tmp/shadowpilot
          PROJECT_DIR="$(find /tmp/shadowpilot -type f -name settings.gradle -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::Could not find the Android Gradle project inside the ZIP."
            find /tmp/shadowpilot -maxdepth 4 -type f
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/ShadowPilotAI-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowPilotAI-debug-apk
          path: ShadowPilotAI-debug.apk
          if-no-files-found: error
